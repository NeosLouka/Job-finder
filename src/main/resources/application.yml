spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/job_scraper_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  tokens:
    greenhouse:
      file-path: data/greenhouse_tokens.txt